[build]
  command = "npm run netlify:build"
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["pg"]

[functions.telegram]
  timeout = 26

[[redirects]]
  from = "/telegram/webhook"
  to = "/.netlify/functions/telegram"
  status = 200
  force = true

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/health"
  status = 200
